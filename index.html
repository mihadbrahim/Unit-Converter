<!DOCTYPE html>
<html>

<head>
    <title>Unit Converter</title>
    <link rel="stylesheet" href="index.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Cantarell:ital,wght@0,400;0,700;1,400;1,700&family=Happy+Monkey&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Karla:ital,wght@0,200..800;1,200..800&family=Libre+Caslon+Condensed:ital,wght@0,400..700;1,400..700&family=Orbitron:wght@400..900&display=swap"
        rel="stylesheet">
</head>

<body>
    <div class="header">
        <h1>Metric/Imperial Unit Conversation</h1>
        <input id="input" type="text">
        <button id="btn">Convert</button>
    </div>
    <div class="length">
        <h3>Length (Meter/Feet)</h3>
        <p> <span id="meters-input-value">00</span> meters = <span id="feets-result">00</span> feets |
            <span id="feets-input-value">00</span> feets = <span id="meters-result">00</span> meters
        </p>
    </div>
    <div class="volume">
        <h3>Volume (Liters/Gallons)</h3>
        <p> <span id="liters-input-value">00</span> liters = <span id="gallons-result">00</span> gallons |
            <span id="gallons-input-value">00</span> gallons = <span id="liters-result">00</span> liters
        </p>
    </div>
    <div class="mass">
        <h3>Mass (Kilograms/Pounds)</h3>
        <p> <span id="kilos-input-value">00</span> kilos = <span id="pounds-result">00</span> pounds |
            <span id="pounds-input-value">00</span> pounds = <span id="kilos-result">00</span> kilos
        </p>
    </div>
    <script src="index.js"></script>
</body>

</html>
